user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;
event{
    worker_connections 1024;
}

http{
    include /etc/nginx/meme.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request"'
                    '$status $body_bytes_sent "$http_referer"'
                    '"$http_referer" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access_log man;
    sendfile on;

    keepalive_timeout 65;
;     ssl_certificate
;     ssl_certificate_key
;     ssl_ciphers

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header x-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header x-Django-User $remote_user;

    upstream api {
        server api:8000;
    }
    upstream flower {
        server flower:5555;
    }
    upstream portainer {
        server portainer:9443;
    }

    map $http_upgrade $connection_upgrade{
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name example.com
        return 301 https://$server_name$request_uri
    }

    server {
        listen 443 ssl http2;
        server_name example.com;

        client_max_body_size 20M;
        error_log /var/lof/nginx/error.log error;

        location /api/v1/ {
            proxy_pass http://api/api/v1/;
            access_log /var/log/api_access.log detailed_log;
            error_log /var/log/api_error.log error;
        }
        location /admin/ {
            proxy_pass http://api/admin/;
            access_log /var/log/nginx/admin_access.log;
        }
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }
    }

    server  {
        listen 443 ssl http2;
        server_name flower.example.com

        location / {
            proxy_pass http://flower
        }
    }

    server  {
        listen 443 ssl http2;
        server_name portainer.example.com

        location / {
            proxy_pass http://portainer
        }
    }

}


